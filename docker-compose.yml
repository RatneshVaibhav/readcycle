# Full local stack:  cp .env.example .env  (then set DB_PASSWORD)  &&  docker compose up --build
name: readcycle

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: readcycle
      POSTGRES_USER: readcycle
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readcycle -d readcycle"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: readcycle-backend:compose
    environment:
      APP_ENV: compose
      DB_HOST: db
      DB_NAME: readcycle
      DB_USER: readcycle
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    image: readcycle-frontend:compose
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  db-data:
