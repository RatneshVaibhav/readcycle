# Images are <registry>/<owner>/readcycle-backend|frontend:<tag>, published by the pipeline.
# image.tag is required and is always a git commit SHA (never "latest"), so every running
# pod traces back to the exact commit that was tested, scanned and built.
image:
  registry: ghcr.io
  owner: ratneshvaibhav
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  env:
    APP_ENV: development
    LOG_LEVEL: INFO
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 192Mi}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPU: 70

frontend:
  replicas: 2
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}   # 48Mi left no headroom under node memory pressure

postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 1Gi
  storageClass: ""        # "" = cluster default
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

database:
  host: ""                # empty = the chart's own postgres
  port: 5432
  name: readcycle
  user: readcycle
  # The password is never in values or Git: create the Secret beforehand, e.g.
  #   kubectl create secret generic readcycle-db --from-literal=password=$(openssl rand -hex 16)
  existingSecret: readcycle-db
  passwordKey: password

ingress:
  enabled: true
  className: nginx
  host: readcycle.localhost

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
  rules:
    enabled: true
  dashboard:
    enabled: true
