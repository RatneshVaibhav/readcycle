{{- if .Values.monitoring.rules.enabled }}
{{- $ns := .Release.Namespace }}
{{- $name := include "readcycle.name" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  labels: {{- include "readcycle.labels" . | nindent 4 }}
spec:
  groups:
    - name: readcycle.alerts
      rules:
        - alert: ReadCycleBackendDown
          expr: sum(kube_deployment_status_replicas_available{namespace="{{ $ns }}",deployment="{{ $name }}-backend"}) < 1
          for: 1m
          labels: {severity: critical, team: readcycle}
          annotations:
            summary: "ReadCycle API has no available replicas"
        - alert: ReadCycleDatabaseDown
          expr: sum(kube_statefulset_status_replicas_ready{namespace="{{ $ns }}",statefulset="{{ $name }}-postgres"}) < 1
          for: 1m
          labels: {severity: critical, team: readcycle}
          annotations:
            summary: "ReadCycle PostgreSQL is not ready"
        - alert: ReadCycleHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ $ns }}",status="5xx"}[2m]))
              / sum(rate(http_requests_total{namespace="{{ $ns }}"}[2m])) > 0.05
          for: 2m
          labels: {severity: warning, team: readcycle}
          annotations:
            summary: "More than 5% of ReadCycle API requests fail"
        - alert: ReadCycleHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{namespace="{{ $ns }}"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning, team: readcycle}
          annotations:
            summary: "ReadCycle API p95 latency above 500 ms"
{{- end }}
