{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "readcycle.name" . }}-backend
  labels: {{- include "readcycle.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "readcycle.selector" (dict "Release" .Release "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
