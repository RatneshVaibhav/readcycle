apiVersion: v1
kind: Service
metadata:
  name: {{ include "readcycle.name" . }}-frontend
  labels:
    {{- include "readcycle.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector: {{- include "readcycle.selector" (dict "Release" .Release "component" "frontend") | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
