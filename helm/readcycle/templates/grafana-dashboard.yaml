{{- if .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "readcycle.name" . }}-dashboard
  labels:
    {{- include "readcycle.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  readcycle-dashboard.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | replace "__NAMESPACE__" .Release.Namespace | indent 4 }}
{{- end }}
