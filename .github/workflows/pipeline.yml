# ReadCycle - CI/CD pipeline (runs on every push and pull request to main)
#
#  backend-test ─┐                       ┌─ sast ────────┐
#  frontend-build┴─────────────────────► ├─ sca ─────────┼─► docker-build ─► image-scan ─┐
#                                        └─ secret-scan ─┘                              │
#                                   security-gate (one policy over 8 reports) ◄─────────┘
#                                        │
#                                      push         both images to GHCR, tag = commit SHA
#                                        │
#                                      deploy-test  throw-away kind cluster: helm upgrade --install + helm test
#                                        │
#                                      promote      commit the new tag to gitops/environments/dev/values.yaml;
#                                                   Argo CD in the cluster pulls the change and rolls it out
name: ReadCycle CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------ build & test
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run pytest (SQLite test database)
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/reports/

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm ci and build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build && ls -la dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ------------------------------------------------------------ security scans
  sast:
    name: SAST (Bandit + Semgrep)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 semgrep==1.179.0
      - name: Bandit (backend)
        run: |
          mkdir -p reports
          bandit -r backend/app -c security/bandit.yaml -f json -o reports/bandit.json --exit-zero -q
          jq -r '"bandit: \(.results | length) findings (\([.results[] | select(.issue_severity == "HIGH")] | length) HIGH) in \(.metrics._totals.loc) lines"' reports/bandit.json
      - name: Semgrep (backend + frontend)
        run: |
          semgrep scan --config p/python --config p/react --config security/semgrep-rules.yml --metrics off \
            --json -o reports/semgrep.json backend/app frontend/src
          jq -r '"semgrep: \(.results | length) findings in \(.paths.scanned | length) files"' reports/semgrep.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-sast
          path: reports/

  sca:
    name: SCA (pip-audit + npm audit + Trivy fs)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned, checksum-verified scanners
        run: bash security/install-tools.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH" && pip install pip-audit==2.10.1
      - name: pip-audit (backend)
        run: |
          mkdir -p reports
          pip-audit -r backend/requirements.txt -f json -o reports/pip-audit.json || true
          jq -r '"pip-audit: \([.dependencies[].vulns[]] | length) vulnerabilities in \(.dependencies | length) packages"' reports/pip-audit.json
      - name: npm audit (frontend runtime dependencies)
        working-directory: frontend
        run: |
          npm audit --omit=dev --json > ../reports/npm-audit.json || true
          jq -c '.metadata.vulnerabilities' ../reports/npm-audit.json
      - name: Trivy filesystem scan (requirements.txt + package-lock.json)
        run: |
          trivy fs --config security/trivy.yaml --quiet --format json -o reports/trivy-fs.json .
          trivy fs --config security/trivy.yaml --quiet .
      - uses: actions/upload-artifact@v4
        with:
          name: security-sca
          path: reports/

  secret-scan:
    name: Secret scan (Gitleaks)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned, checksum-verified scanners
        run: bash security/install-tools.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gitleaks
        run: |
          mkdir -p reports
          gitleaks dir . --config security/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path reports/gitleaks.json --exit-code 0
          jq -r '"gitleaks: \(length) secrets found"' reports/gitleaks.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-secrets
          path: reports/

  # ------------------------------------------------------------ images
  docker-build:
    name: Docker build (backend + frontend)
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t readcycle-backend:"$GITHUB_SHA" backend
          docker build -t readcycle-frontend:"$GITHUB_SHA" frontend
          docker images | grep -E "readcycle-(backend|frontend)"
      - name: Save images
        run: |
          mkdir -p images
          docker save readcycle-backend:"$GITHUB_SHA" -o images/backend.tar
          docker save readcycle-frontend:"$GITHUB_SHA" -o images/frontend.tar
          ls -lh images
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images/
          retention-days: 1

  image-scan:
    name: Image scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: images
      - name: Install pinned, checksum-verified scanners
        run: bash security/install-tools.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Trivy - the exact tarballs that will be pushed
        run: |
          mkdir -p reports
          for img in backend frontend; do
            trivy image --config security/trivy.yaml --quiet --input images/$img.tar --format json -o reports/trivy-image-$img.json
            jq -r --arg i "$img" '"\($i) image: \([.Results[]?.Vulnerabilities[]?] | length) HIGH/CRITICAL (\(.Metadata.OS.Family) \(.Metadata.OS.Name))"' reports/trivy-image-$img.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: security-images
          path: reports/

  security-gate:
    name: Security gate
    needs: [sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: security-*
          merge-multiple: true
          path: reports
      - name: Apply the security policy
        run: security/security-gate.sh reports | tee gate.txt
      - name: Publish the gate result
        if: always()
        run: |
          { echo '### Security gate'; echo '```'; cat gate.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ delivery
  push:
    name: Push images (tag = commit SHA)
    needs: security-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: images
      - name: Load images
        run: docker load -i images/backend.tar && docker load -i images/frontend.tar
      - name: Log in to GitHub Container Registry
        if: env.REGISTRY == 'ghcr.io'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag and push
        run: |
          for img in backend frontend; do
            target="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/readcycle-$img:$GITHUB_SHA"
            docker tag "readcycle-$img:$GITHUB_SHA" "$target"
            docker push -q "$target"
            echo "pushed $target"
          done

  deploy-test:
    name: Deploy test (kind + helm test)
    needs: push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Create a throw-away kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Load the pushed images into the cluster
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in backend frontend; do
            ref="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/readcycle-$img:$GITHUB_SHA"
            docker pull -q "$ref" && kind load docker-image "$ref" --name ci
          done
      - name: helm upgrade --install, then helm test
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret generic readcycle-db -n readcycle --from-literal=password="$(openssl rand -hex 16)"
          helm upgrade --install readcycle helm/readcycle -n readcycle --wait --timeout 6m \
            --set image.registry="$REGISTRY" --set image.owner="${GITHUB_REPOSITORY_OWNER,,}" \
            --set image.tag="$GITHUB_SHA" --set image.pullPolicy=Never \
            --set ingress.enabled=false --set monitoring.serviceMonitor.enabled=false \
            --set monitoring.rules.enabled=false --set monitoring.dashboard.enabled=false
          kubectl get pods,svc -n readcycle
          helm test readcycle -n readcycle

  promote:
    name: Promote to dev (GitOps)
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit the new image tag (Argo CD rolls it out)
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"$GITHUB_SHA\"/" gitops/environments/dev/values.yaml
          if git diff --quiet; then echo "dev already runs $GITHUB_SHA"; exit 0; fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: this commit only changes the desired state; it must not start another run
          git commit -qam "Deploy ${GITHUB_SHA::7} to dev [skip ci]"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "dev now wants image tag $GITHUB_SHA ($(git rev-parse --short HEAD))"
