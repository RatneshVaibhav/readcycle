# Argo CD renders helm/readcycle from this GitHub repository with the dev environment's
# values and keeps the readcycle namespace equal to it (prune + self-heal).
# The pipeline's "promote" job changes image.tag in gitops/environments/dev/values.yaml;
# Argo CD notices the new commit (polls every 30 s) and rolls the new images out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: readcycle-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RatneshVaibhav/readcycle.git
    targetRevision: main
    path: helm/readcycle
    helm:
      releaseName: readcycle
      valueFiles:
        - ../../gitops/environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: readcycle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
