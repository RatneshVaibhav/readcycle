# Desired state of the "dev" environment, deployed by Argo CD.
# image.tag is rewritten by the pipeline's promote job after every build that passes the
# security gate, so the running pods always trace back to one commit.
image:
  registry: ghcr.io
  owner: ratneshvaibhav
  tag: "ecfd0c2f418394247a362f2d4197fbe4d37c9ca0"
backend:
  env:
    APP_ENV: development
    LOG_LEVEL: INFO
