# Plain-manifest version of ReadCycle:  kubectl apply -k k8s/manifests/
# (the Helm chart in ../../helm is the same application, parameterised)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: readcycle-raw
labels:
  - pairs:
      app.kubernetes.io/part-of: readcycle
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
# the database password is read from db.env (git-ignored, see db.env.example)
secretGenerator:
  - name: readcycle-db
    envs: [db.env]
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: readcycle-backend
    newName: localhost:5001/ratneshvaibhav/readcycle-backend
    newTag: "1.0.0"
  - name: readcycle-frontend
    newName: localhost:5001/ratneshvaibhav/readcycle-frontend
    newTag: "1.0.0"
