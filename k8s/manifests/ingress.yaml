# One host, two backends: the UI on / and the API on /api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readcycle
spec:
  ingressClassName: nginx
  rules:
    - host: readcycle.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: readcycle-backend, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: readcycle-frontend, port: {name: http}}
