# Non-secret configuration of the backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: readcycle-backend-config
data:
  APP_ENV: kubernetes
  LOG_LEVEL: INFO
  DB_HOST: readcycle-postgres
  DB_PORT: "5432"
  DB_NAME: readcycle
  DB_USER: readcycle
  CORS_ORIGINS: http://readcycle.localhost:8088
